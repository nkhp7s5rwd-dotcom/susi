<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teamprotokoll</title>
<style>
:root{--bg:#f1eadc;--card:#fbf8f2;--text:#3b3128;--muted:#8a7b6a;--line:#e6dccb;--head:#f3ebdc;--accent:#a67c52;--accent2:#8c6540;--accent-t:#fff;--shadow:0 10px 34px rgba(92,70,40,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a15;--card:#2a241d;--text:#efe6d8;--muted:#b3a28b;--line:#40372b;--head:#342d24;--accent:#d4a574;--accent2:#bf8f5c;--accent-t:#241c13;--shadow:0 10px 34px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1f1a15;--card:#2a241d;--text:#efe6d8;--muted:#b3a28b;--line:#40372b;--head:#342d24;--accent:#d4a574;--accent2:#bf8f5c;--accent-t:#241c13;--shadow:0 10px 34px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px 16px}
.sheet{max-width:1040px;margin:0 auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.top{background:linear-gradient(135deg,#cfb08a,var(--accent));color:#fff;padding:22px 26px}
.top h1{font:600 26px Georgia,"Times New Roman",serif;margin:0 0 2px;letter-spacing:.3px}
.top small{opacity:.85}
.body{padding:22px 26px 26px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.head label{font-weight:600;color:var(--muted)}
input,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=date]{width:auto}
textarea{resize:none;overflow:hidden;min-height:60px;display:block}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:8px;vertical-align:top;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--head);font-family:Georgia,serif;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
th:nth-child(1){width:20%}th:nth-child(2){width:46%}th:nth-child(3){width:14%}th:nth-child(4){width:16%}th:nth-child(5){width:4%}
td.x{text-align:center}
td.x button{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px}
td.x button:hover{background:#b5443822;color:#b54438}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:9px 18px;cursor:pointer;transition:transform .1s,background .15s}
button:hover{background:var(--head)}
button:active{transform:scale(.97)}
button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.p:hover{background:var(--accent2)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
#printTitle{display:none}
#gate{max-width:340px;margin:18vh auto 0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:28px;text-align:center}
#gate p{margin:0 0 14px;font:600 20px Georgia,serif}
#gate input{margin-bottom:12px;text-align:center}
#gateErr{color:#b54438;font-size:13px;min-height:18px;margin-top:10px}
.locked .sheet{display:none}
.unlocked #gate{display:none}
@media (max-width:600px){.top,.body{padding-left:16px;padding-right:16px}}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--line:#000;--head:#eee;--muted:#000;padding:0}
  body{padding:0;background:#fff}
  .sheet{box-shadow:0;border-radius:0;max-width:none}
  .top,.noprint,.x,th:nth-child(5){display:none!important}
  .body{padding:0}
  #printTitle{display:block;font-size:16px;font-weight:600;margin-bottom:10px}
  .head{display:none}
  .wrap{border:0;border-radius:0;overflow:visible}
  th,td{border:1px solid #000}
  input,textarea{border:0;padding:2px;color:#000;box-shadow:none}
  textarea{min-height:0}
  table{min-width:0}
  tr{break-inside:avoid}
  @page{margin:18mm}
}
</style>
</head>
<body class="locked">
<div id="gate">
  <p>Teamprotokoll – Passwort</p>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="off">
  <button id="unlock" class="p">Öffnen</button>
  <div id="gateErr"></div>
</div>
<div class="sheet">
  <div class="top"><h1>Teamprotokoll</h1><small>Thema · Beschreibung · Wann · Wer</small></div>
  <div class="body">
  <div class="head noprint">
    <label for="datum">Teamsitzung vom:</label>
    <input type="date" id="datum">
  </div>
  <div id="printTitle"></div>
  <div class="wrap">
    <table>
      <thead><tr><th>Thema</th><th>Beschreibung</th><th>Wann</th><th>Wer</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="bar noprint">
    <button id="add">+ Zeile hinzufügen</button>
    <button id="pdf" class="p">Als PDF exportieren</button>
    <button id="reset">Neues Protokoll</button>
  </div>
  <div class="hint noprint">PDF: Im Druckdialog „Als PDF speichern“ wählen. Eingaben werden automatisch im Browser gespeichert.</div>
</div>
</div>
<script>
(function(){
  var KEY="teamprotokoll_v1";
  var rowsEl=document.getElementById("rows"), datum=document.getElementById("datum");
  function grow(t){t.style.height="auto";t.style.height=Math.max(60,t.scrollHeight+2)+"px";}
  function save(){
    var data={datum:datum.value,rows:[]};
    rowsEl.querySelectorAll("tr").forEach(function(tr){
      data.rows.push(Array.prototype.map.call(tr.querySelectorAll("textarea"),function(t){return t.value;}));
    });
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  }
  function addRow(vals){
    vals=vals||["","","",""];
    var tr=document.createElement("tr");
    for(var i=0;i<4;i++){
      var td=document.createElement("td"),t=document.createElement("textarea");
      t.value=vals[i]||"";
      t.addEventListener("input",function(){grow(this);save();});
      td.appendChild(t);tr.appendChild(td);
    }
    var x=document.createElement("td");x.className="x";
    var b=document.createElement("button");b.textContent="✕";b.title="Zeile löschen";
    b.addEventListener("click",function(){tr.remove();save();});
    x.appendChild(b);tr.appendChild(x);
    rowsEl.appendChild(tr);
    tr.querySelectorAll("textarea").forEach(grow);
  }
  function fmt(v){if(!v)return "";var p=v.split("-");return p[2]+"."+p[1]+"."+p[0];}
  function title(){document.getElementById("printTitle").textContent="Teamsitzung vom "+fmt(datum.value);}
  function load(){
    var d=null;
    try{d=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
    if(d&&d.rows&&d.rows.length){datum.value=d.datum||"";d.rows.forEach(addRow);}
    else{datum.value=new Date().toISOString().slice(0,10);addRow();addRow();addRow();}
  }
  datum.addEventListener("input",save);
  document.getElementById("add").addEventListener("click",function(){addRow();save();});
  document.getElementById("pdf").addEventListener("click",function(){
    title();rowsEl.querySelectorAll("textarea").forEach(grow);window.print();
  });
  document.getElementById("reset").addEventListener("click",function(){
    if(!confirm("Alle Eingaben löschen und neues Protokoll starten?"))return;
    rowsEl.innerHTML="";datum.value=new Date().toISOString().slice(0,10);addRow();addRow();addRow();save();
  });
  window.addEventListener("beforeprint",function(){title();rowsEl.querySelectorAll("textarea").forEach(grow);});
  load();

  var HASH="b77cee999c72f1afcaca7974345238f92e226d8f4afe19f9ced3cd72f69f05f2";
  function open(){document.body.className="unlocked";rowsEl.querySelectorAll("textarea").forEach(grow);}
  function sha(s){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
    });
  }
  function tryUnlock(){
    var v=document.getElementById("pw").value;
    sha(v).then(function(h){
      if(h===HASH){try{sessionStorage.setItem("tp_ok","1");}catch(e){}open();}
      else{document.getElementById("gateErr").textContent="Falsches Passwort";}
    });
  }
  document.getElementById("unlock").addEventListener("click",tryUnlock);
  document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryUnlock();});
  try{if(sessionStorage.getItem("tp_ok")==="1")open();}catch(e){}
})();
</script>
</body>
</html>
